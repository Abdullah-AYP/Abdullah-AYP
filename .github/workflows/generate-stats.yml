name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone and Run Stats Generator Locally
        run: |
          git clone https://github.com/anuraghazra/github-readme-stats.git
          cd github-readme-stats
          npm install
          
          # Install express to run our custom local server
          npm install express dotenv
          
          # Inject a tiny Express server to run the Vercel functions
          cat << 'EOF' > server.js
          const express = require('express');
          const app = express();
          require('dotenv').config();
          
          app.get('/api', require('./api/index.js'));
          app.get('/api/top-langs', require('./api/top-langs.js'));
          
          app.listen(9000, () => console.log('Local server started on 9000'));
          EOF
          
          # Create the .env file with your PAT
          echo "PAT_1=${{ secrets.PAT_1 }}" > .env
          
          # Boot the local server in the background
          node server.js &
          
          # Wait 5 seconds for the server to wake up
          sleep 5
          
          # Fetch the SVGs directly from our local server
          curl --fail "http://127.0.0.1:9000/api?username=Abdullah-AYP&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117" > ../github-stats.svg
          curl --fail "http://127.0.0.1:9000/api/top-langs/?username=Abdullah-AYP&layout=compact&theme=radical&hide_border=true&bg_color=0D1117" > ../top-langs.svg

      - name: Commit and Push SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git commit -m "Update GitHub stats SVGs" || echo "No changes to commit"
          git push
