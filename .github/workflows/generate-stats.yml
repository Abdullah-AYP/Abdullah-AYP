name: Generate GitHub Stats SVGs

on:
  schedule:
    - cron: "0 0 * * *" # Runs automatically at midnight UTC daily
  workflow_dispatch: # Allows you to run it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Clone and Run Stats Generator Locally
        env:
          PAT_1: ${{ secrets.PAT_1 }}
        run: |
          # Clone the official stats engine
          git clone https://github.com/anuraghazra/github-readme-stats.git
          cd github-readme-stats
          npm install
          
          # Start the server in the background
          npm start &
          sleep 15 # Give the server time to boot up

          # Fetch General Stats Card
          curl "http://localhost:9000/api?username=Abdullah-AYP&show_icons=true&theme=radical&hide_border=true&bg_color=0D1117" > ../github-stats.svg

          # Fetch Top Languages Card
          curl "http://localhost:9000/api/top-langs/?username=Abdullah-AYP&layout=compact&theme=radical&hide_border=true&bg_color=0D1117" > ../top-langs.svg

      - name: Commit and Push SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-stats.svg top-langs.svg
          git commit -m "Update GitHub stats SVGs" || echo "No changes to commit"
          git push
